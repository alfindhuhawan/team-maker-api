name: Go CI/CD with Railway

on:
  push:
    branches:
      - main  # atau branch yang kamu gunakan untuk deploy

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'  # ganti sesuai versi Go kamu

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    if: success()  # hanya jalan kalau job build-test sukses

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: railway login --apiKey $RAILWAY_API_TOKEN

      - name: Deploy to Railway
        run: railway up --detach
